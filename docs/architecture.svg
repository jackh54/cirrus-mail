<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Cirrus Mail architecture</title>
  <desc id="desc">Inbound mail flows from a sender through Cloudflare Email Routing to the Worker's email() handler, which stores messages in R2 and D1. The browser talks to the Worker's fetch() handler for the API and the web app. Outbound mail goes from the Worker through Email Sending to the internet. A cron trigger runs scheduled() every minute.</desc>
  <defs>
    <radialGradient id="glow" cx="1080" cy="0" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F6BFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#4F6BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80" cy="640" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38D6C4" stop-opacity=".12"/>
      <stop offset="1" stop-color="#38D6C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mk" x1="6" y1="55" x2="57" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F6BFF"/><stop offset=".55" stop-color="#4A9BEF"/><stop offset="1" stop-color="#38D6C4"/>
    </linearGradient>
    <marker id="ai" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#7C93FF"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#38D6C4"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#C9D1E8"/></marker>
  </defs>

  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .h { fill: #F7F8FC; font-size: 17px; font-weight: 600; }
    .s { fill: #9AA4C0; font-size: 13px; }
    .m { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { fill: #9AA4C0; font-size: 12px; letter-spacing: 1.4px; }
    .box { fill: #151C30; stroke: #2B3554; stroke-width: 1.5; }
    .ext { fill: #11182A; stroke: #3A4566; stroke-width: 1.5; }
  </style>

  <!-- card -->
  <rect x="1" y="1" width="1198" height="638" rx="24" fill="#0E1424" stroke="#26304A" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="638" rx="24" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="638" rx="24" fill="url(#glow2)"/>

  <!-- header -->
  <g transform="translate(40 30) scale(.5)" fill="none" stroke="url(#mk)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M38 22H15a9 9 0 0 0-9 9v15a9 9 0 0 0 9 9h34a9 9 0 0 0 9-9V33"/>
    <path d="M11 27c6 6.5 13 11 21 11s14-5 19-11c3.5-4 6-8 6-12.5a6 6 0 0 0-12 0 3.2 3.2 0 0 0 5.4 2.3"/>
  </g>
  <text x="80" y="57" class="h">Cirrus Mail</text>
  <text x="178" y="57" class="s">architecture</text>

  <!-- account boundary -->
  <rect x="220" y="96" width="760" height="470" rx="18" fill="#F7F8FC" fill-opacity=".015" stroke="#46527A" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="244" y="128" class="lbl m">YOUR CLOUDFLARE ACCOUNT</text>

  <!-- outside: sender, browser, recipients -->
  <rect x="40" y="170" width="150" height="72" rx="14" class="ext"/>
  <text x="60" y="201" class="h">Sender</text>
  <text x="60" y="223" class="s">any mail server</text>

  <rect x="40" y="294" width="150" height="72" rx="14" class="ext"/>
  <text x="60" y="325" class="h">Browser</text>
  <text x="60" y="347" class="s">web app · PWA</text>

  <rect x="1010" y="418" width="150" height="72" rx="14" class="ext"/>
  <text x="1030" y="449" class="h">Recipients</text>
  <text x="1030" y="471" class="s">the internet</text>

  <!-- Email Routing -->
  <rect x="250" y="160" width="200" height="92" rx="14" class="box"/>
  <text x="270" y="195" class="h">Email Routing</text>
  <text x="270" y="217" class="s">catch-all rule</text>
  <text x="270" y="236" class="s">action: Send to a Worker</text>

  <!-- Worker -->
  <rect x="490" y="112" width="260" height="420" rx="18" fill="#4F6BFF" fill-opacity=".07" stroke="#4F6BFF" stroke-opacity=".55" stroke-width="1.5"/>
  <text x="510" y="142" class="lbl m">WORKER · HONO</text>

  <rect x="510" y="160" width="220" height="92" rx="12" class="box"/>
  <text x="528" y="192" class="h m">email()</text>
  <text x="528" y="214" class="s">parse · thread · spam score</text>
  <text x="528" y="233" class="s">filters · auto-reply</text>

  <rect x="510" y="284" width="220" height="92" rx="12" class="box"/>
  <text x="528" y="316" class="h m">fetch()</text>
  <text x="528" y="338" class="s">/api/* (JSON)</text>
  <text x="528" y="357" class="s">React SPA from static assets</text>

  <rect x="510" y="408" width="220" height="104" rx="12" class="box"/>
  <text x="528" y="440" class="h m">scheduled()</text>
  <text x="528" y="462" class="s">cron trigger, every minute</text>
  <text x="528" y="481" class="s">scheduled sends · cleanup</text>

  <!-- storage + sending -->
  <rect x="800" y="160" width="150" height="92" rx="14" class="box"/>
  <text x="820" y="195" class="h">R2</text>
  <text x="820" y="217" class="s">raw .eml, bodies,</text>
  <text x="820" y="236" class="s">attachments</text>

  <rect x="800" y="284" width="150" height="92" rx="14" class="box"/>
  <text x="820" y="319" class="h">D1</text>
  <text x="820" y="341" class="s">metadata, threads,</text>
  <text x="820" y="360" class="s">FTS5 search</text>

  <rect x="800" y="418" width="150" height="72" rx="14" class="box"/>
  <text x="820" y="449" class="h">Email Sending</text>
  <text x="820" y="471" class="s m">send_email</text>

  <!-- inbound -->
  <g fill="none" stroke="#7C93FF" stroke-width="2" marker-end="url(#ai)">
    <path d="M190 206H244"/>
    <path d="M450 206H504"/>
    <path d="M730 200H794"/>
    <path d="M730 222C766 222 762 312 794 312"/>
  </g>
  <!-- app + API -->
  <g fill="none" stroke="#C9D1E8" stroke-width="2" marker-start="url(#aa)" marker-end="url(#aa)">
    <path d="M196 330H504"/>
    <path d="M736 336H794"/>
  </g>
  <!-- outbound -->
  <g fill="none" stroke="#38D6C4" stroke-width="2" marker-end="url(#ao)">
    <path d="M730 356C768 356 762 444 794 444"/>
    <path d="M730 462C760 462 770 466 794 466"/>
    <path d="M950 454H1004"/>
  </g>

  <!-- legend -->
  <g class="s">
    <path d="M244 600H274" stroke="#7C93FF" stroke-width="2" marker-end="url(#ai)"/>
    <text x="284" y="604" class="s">inbound mail</text>
    <path d="M404 600H434" stroke="#C9D1E8" stroke-width="2" marker-end="url(#aa)"/>
    <text x="444" y="604" class="s">web app and API</text>
    <path d="M594 600H624" stroke="#38D6C4" stroke-width="2" marker-end="url(#ao)"/>
    <text x="634" y="604" class="s">outbound mail</text>
    <text x="760" y="604" class="s">No Durable Objects, Queues or third-party services.</text>
  </g>
</svg>
